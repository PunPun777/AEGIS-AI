# Render deployment configuration for AEGIS-AI backend
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aegis-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false   # Set manually in Render dashboard to your Vercel frontend URL
                      # e.g. https://aegis-ai.vercel.app

